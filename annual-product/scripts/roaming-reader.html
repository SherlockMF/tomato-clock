<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>离职后的第一个月 · 旅居试读</title>
<style>
:root{color-scheme:light;--paper:#fffcf5;--ink:#272b29;--faded:#555e58;--pine:#235349;--line:#c4c9bc;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);background:#eaece5}
*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:28px 18px 60px}header{border-block:3px solid var(--pine);border-bottom-width:1px;padding:15px 0;margin-bottom:16px}
h1,h2{font-family:"Songti SC","SimSun",serif;color:var(--pine);line-height:1.35;margin:0}h1{font-size:clamp(1.7rem,5vw,2.55rem)}h2{font-size:clamp(1.35rem,4vw,1.85rem)}
.tools,.actions,nav{display:flex;align-items:center;flex-wrap:wrap;gap:10px}label{font-size:.9rem;color:var(--faded)}select,button{font:inherit;color:var(--ink);background:var(--paper);min-height:42px;padding:6px 9px;border:1px solid #808d80;border-radius:3px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b85f27;outline-offset:3px}
article,aside{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--pine);padding:clamp(18px,4vw,36px);margin:16px 0}.clock,.mark{color:var(--faded);font-size:.87rem;line-height:1.65}.clock{margin:9px 0 18px}.mark{font-weight:600;margin:0 0 7px}.prose{font:1.15rem/1.95 "Songti SC","STSong","SimSun",serif;white-space:pre-line;margin:0 0 1.1em}article .actions{border-top:1px solid var(--line);padding-top:14px}nav{justify-content:space-between}.primary{background:var(--pine);color:white}aside{border-top-color:#996342}aside label{display:block;margin-bottom:16px}#status{color:var(--pine)}textarea{width:100%;min-height:130px;font:inherit}#manual{display:block;margin:12px 0}[hidden]{display:none!important}small{color:var(--faded);display:block;margin-top:7px}
@media(max-width:410px){main{padding-inline:12px}.tools{gap:7px}.prose{font-size:1.08rem}}
</style>
</head>
<body><main>
<header><h1>离职后的第一个月</h1><small>北京出发 · 30 日旅居试读</small></header>
<div class="tools">
<label>人格 <select id="type"></select></label>
<label>性别 <select id="gender"><option>女</option><option>男</option></select></label>
<label>跳到日期 <select id="day"></select></label>
<label>专注次数 <select id="turn"></select></label>
</div>
<article aria-labelledby="title"><h2 id="title" tabindex="-1"></h2><p id="clock" class="clock"></p><div id="story"></div>
<div class="actions"><button id="copy" class="primary">复制这段故事</button><button id="compare" aria-controls="panel" aria-expanded="false">看看别人这一次遇到什么</button></div></article>
<aside id="panel" hidden><label>对照人格 <select id="other"></select></label><div id="alternative"></div></aside>
<details id="accounts" hidden><summary>查看这次的收支</summary><p id="balance"></p></details>
<p id="status" role="status"></p><label id="manual" hidden>可复制下列文字<textarea id="copytext" readonly></textarea></label>
<nav aria-label="阅读进度"><button id="prev">← 上一次专注</button><button id="next">下一次专注 →</button></nav>
</main>
<script type="application/json" id="books">MONTH_DATA_HERE</script>
<script>
'use strict';
const payload=JSON.parse(document.getElementById('books').textContent);
const books=payload.stories||payload;
const el=id=>document.getElementById(id), types=Object.keys(books);
const type=el('type'), turn=el('turn'), gender=el('gender'), day=el('day'), other=el('other');
function options(select,pairs){select.replaceChildren(...pairs.map(([key,label])=>new Option(label,key)));}
options(type,types.map(t=>[t,t]));
const dates=new Map(books[types[0]].flatMap(w=>w.events.map(e=>[String(e.day),e.at.slice(0,10)])));
options(day,[...dates.entries()]);
options(turn,books[types[0]].map(w=>[String(w.number),'第 '+w.number+' 次']));
function card(person){return books[person][Number(turn.value)-1];}
function prose(e){return e.text.replaceAll('{称呼}',gender.value==='男'?'小伙子':'姑娘');}
function display(box,current){
  box.replaceChildren();
  for(const event of current.events){
    const mark=document.createElement('p'),body=document.createElement('p');
    mark.className='mark';mark.textContent=event.at.slice(5)+' · '+event.city+(event.id.startsWith('wake.')?' · 次晨':'');
    body.className='prose';body.textContent=prose(event);box.append(mark,body);
  }
}
let revision=0;
function render(){
  revision++;const current=card(type.value), n=current.number;
  el('title').textContent='第 '+n+' 次专注';day.value=String(current.events[0].day);
  el('clock').textContent=current.from.slice(5)+' 至 '+current.until.slice(5)+'（北京时间） · 清醒 3 小时 20 分'+
    (current.sleep?' · 跨夜，睡眠 8 小时已跳过':'');
  display(el('story'),current);
  el('accounts').hidden=!current.account;el('accounts').open=false;
  if(current.account){
    el('balance').textContent=[...current.account.items,'余额 '+current.account.cash.toLocaleString('zh-CN')+' 元'].join('　');
  }
  el('prev').disabled=n===1;el('next').disabled=n===books[type.value].length;
  const alternatives=types.filter(t=>t!==type.value);
  options(other,alternatives.map(t=>[t,t]));
  other.value=alternatives.find(t=>card(t).events.length!==current.events.length||card(t).events.some((e,i)=>e.text!==current.events[i]?.text))||alternatives[0];
  el('panel').hidden=true;el('compare').setAttribute('aria-expanded','false');el('compare').textContent='看看别人这一次遇到什么';
  el('manual').hidden=true;el('copytext').value='';el('status').textContent='';
}
function flip(delta){turn.value=String(Number(turn.value)+delta);render();el('title').focus();}
type.onchange=render;gender.onchange=render;turn.onchange=render;
day.onchange=()=>{const n=Number(day.value);turn.value=String(books[type.value].find(w=>w.events.some(e=>e.day===n)).number);render();day.value=String(n);};
el('prev').onclick=()=>flip(-1);el('next').onclick=()=>flip(1);
other.onchange=()=>display(el('alternative'),card(other.value));
el('compare').onclick=()=>{const open=el('panel').hidden;el('panel').hidden=!open;el('compare').setAttribute('aria-expanded',String(open));
  el('compare').textContent=open?'收起对照':'看看别人这一次遇到什么';if(open){display(el('alternative'),card(other.value));other.focus();}};
el('copy').onclick=async()=>{
  const current=card(type.value), version=revision;
  const text=[document.querySelector('h1').textContent+' · '+type.value+' · 第 '+current.number+' 次专注',...current.events.map(e=>e.at.slice(5)+' · '+e.city+'\n'+prose(e))].join('\n\n');
  try{await navigator.clipboard.writeText(text);if(version===revision)el('status').textContent='已复制当前故事。';}
  catch{if(version!==revision)return;el('manual').hidden=false;el('copytext').value=text;el('copytext').focus();el('copytext').select();}
};
const entry=new URLSearchParams(location.search);
if(types.includes(entry.get('type')))type.value=entry.get('type');
const startDay=Number(entry.get('day'));
const startWindow=books[type.value].find(w=>w.events.some(e=>e.day===startDay));
const startTurn=Number(entry.get('turn'));
if(Number.isInteger(startTurn)&&startTurn>=1&&startTurn<=books[type.value].length)turn.value=String(startTurn);
else if(startWindow)turn.value=String(startWindow.number);
render();
if(!startTurn&&startWindow)day.value=String(startDay);
</script></body></html>
